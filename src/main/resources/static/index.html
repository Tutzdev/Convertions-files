<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boost.Convert mini</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<svg width="0" height="0" class="sprite" aria-hidden="true">
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1.5"/><rect width="7" height="7" x="14" y="3" rx="1.5"/><rect width="7" height="7" x="14" y="14" rx="1.5"/><rect width="7" height="7" x="3" y="14" rx="1.5"/></symbol>
  <symbol id="i-activity" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol>
  <symbol id="i-code" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></symbol>
</svg>

<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="#convert" data-view="convert">
      <img src="img/rocket-white.png" alt="" width="34" height="30">
      <span class="brand-name">Boost<span class="brand-dot">.</span>Convert</span>
      <span class="brand-tag">mini</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a class="nav-item" href="#convert" data-view="convert"><svg class="icon"><use href="#i-upload"/></svg>Convert</a>
      <a class="nav-item" href="#converters" data-view="converters"><svg class="icon"><use href="#i-grid"/></svg>Converters</a>
      <a class="nav-item" href="#activity" data-view="activity"><svg class="icon"><use href="#i-activity"/></svg>Activity</a>
    </nav>
    <div class="sidebar-foot">
      <p class="privacy"><svg class="icon"><use href="#i-shield"/></svg><span>Files are deleted <strong id="retention-label">30 minutes</strong> after converting. No account needed.</span></p>
      <a class="nav-item nav-api" href="swagger-ui.html" target="_blank" rel="noopener"><svg class="icon"><use href="#i-code"/></svg>API docs</a>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="view-title">Convert</h1>
        <p id="view-subtitle" class="muted">Drop a file, pick the output, download the result.</p>
      </div>
      <p id="queue-status" class="queue-pill" role="status"><span class="dot"></span><span>Connecting…</span></p>
    </header>

    <section id="view-convert" class="view" data-title="Convert" data-subtitle="Drop a file, pick the output, download the result.">
      <div id="kpis" class="kpis" aria-label="Totals"></div>

      <div class="convert-grid">
        <article class="card">
          <div class="card-head"><h2>New conversion</h2></div>
          <form id="convert-form" class="convert-form" novalidate>
            <input id="file-input" class="visually-hidden" type="file" name="file">

            <label id="dropzone" class="dropzone" for="file-input">
              <span class="drop-icon"><img src="img/rocket.png" alt="" width="40" height="36"></span>
              <span class="drop-title">Drop a file here</span>
              <span class="drop-sub">or <span class="link">browse your computer</span></span>
              <span id="drop-formats" class="drop-formats"></span>
            </label>

            <div id="selection" class="selection" hidden>
              <div class="file-row">
                <span id="selected-badge" class="badge"></span>
                <div class="file-meta">
                  <p id="selected-name" class="file-name"></p>
                  <p id="selected-size" class="muted small"></p>
                </div>
                <button type="button" id="clear-file" class="icon-btn" aria-label="Choose another file"><svg class="icon"><use href="#i-x"/></svg></button>
              </div>

              <fieldset id="targets" class="targets">
                <legend>Convert to</legend>
                <div id="target-options" class="target-options"></div>
              </fieldset>

              <p id="convert-error" class="form-error" role="alert"></p>
              <button id="convert-button" class="btn btn-primary btn-block" type="submit">Convert</button>
            </div>
          </form>
        </article>

        <article class="card">
          <div class="card-head">
            <h2>Your conversions</h2>
            <span class="muted small">This browser only</span>
          </div>
          <ul id="jobs" class="jobs" aria-live="polite"></ul>
        </article>
      </div>
    </section>

    <section id="view-converters" class="view" hidden data-title="Converters" data-subtitle="Ten conversions, each one a single class behind the same interface.">
      <div id="catalog" class="catalog"></div>
    </section>

    <section id="view-activity" class="view" hidden data-title="Activity" data-subtitle="Live numbers from this instance. Aggregates only, no file names.">
      <div class="activity-grid">
        <article class="card">
          <div class="card-head"><h2>By converter</h2></div>
          <div class="table-wrap"><table id="usage-table"></table></div>
        </article>
        <article class="card queue-card">
          <div class="card-head"><h2>Worker queue</h2></div>
          <div id="queue-detail" class="queue-detail"></div>
        </article>
      </div>
    </section>
  </main>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<script src="app.js"></script>
</body>
</html>
