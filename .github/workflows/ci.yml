name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      # Anonymous Docker Hub pulls are rate limited on shared runners, so the base images come from
      # the Docker official images mirror on Amazon ECR Public.
      - name: Build image
        run: docker build --build-arg BASE_REGISTRY=public.ecr.aws/docker/library -t boostconvert-mini .

      # Proves the packaged jar finds the WebP reader (ImageIO plugins inside a fat jar) and that the
      # whole upload, poll and download flow works in the container.
      - name: Smoke test the container
        run: |
          docker run -d --name app -p 8080:8080 boostconvert-mini
          for i in $(seq 1 60); do curl -fs localhost:8080/actuator/health && break; sleep 1; done
          id=$(curl -fs -F file=@src/test/resources/fixtures/half-transparent.webp -F target=png \
            localhost:8080/api/v1/conversions | jq -r .id)
          for i in $(seq 1 30); do
            status=$(curl -fs localhost:8080/api/v1/conversions/$id | jq -r .status)
            [ "$status" = "SUCCEEDED" ] && break
            sleep 1
          done
          curl -fs -o converted.png localhost:8080/api/v1/conversions/$id/result
          file converted.png | grep -q "PNG image data"

      - name: Container logs
        if: always()
        run: docker logs app || true
